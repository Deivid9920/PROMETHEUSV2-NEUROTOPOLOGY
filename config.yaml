# Prometheus-NS configuration. Single source of truth for every
# hyperparameter used by the pipeline; modules must read their values
# from here instead of hardcoding them.

seed: 42

data:
  sources:
    - gutenberg
    - arxiv
    - wikipedia
  max_pages_per_source: 200
  out_dir: data_raw
  user_agent: PrometheusNS-Research/0.1
  rps: 1.0
  timeout_s: 20
  retries: 3
  holdout_frac: 0.02

clean:
  min_doc_chars: 500
  max_doc_chars: 100000
  minhash_perms: 128      # MinHash permutations for near-duplicate detection
  minhash_jaccard: 0.8    # LSH threshold: pairs above are near-duplicates
  keep_quantile: 0.8      # keep the top 80% by heuristic quality score
  shingle_words: 5        # shingle size in words, computed per paragraph
  flush_every_docs: 200000  # rebuild the LSH index every N docs to bound RAM
  mean_word_len_min: 3
  mean_word_len_max: 10
  symbol_ratio_max: 0.1   # Gopher rule: fraction of non-alphanumeric chars
  arxiv_symbol_ratio_max: 0.2  # relaxed for arXiv so formulas/citations survive
  punct_line_frac_min: 0.8
  stopword_ratio_min: 0.3

tokenizer:
  vocab_nano: 8000
  vocab_small: 16000
  sample_mb: 200          # corpus sample used to train the BPE tokenizer

model:
  profile: auto          # auto | nano | small | large; auto probes the hardware
                         # and adapts (prometheus_ns/autofit.py, thresholds below)
  nano:
    d_model: 384
    n_layer: 6
    n_head: 6
    n_kv_head: 6
    d_ff: 1024
    max_seq: 256
    vocab: 8000
    tie_embeddings: true
  small:
    d_model: 768
    n_layer: 12
    n_head: 12
    n_kv_head: 12
    d_ff: 2048
    max_seq: 512
    vocab: 16000
    tie_embeddings: true
  large:
    d_model: 1024
    n_layer: 16
    n_head: 16
    n_kv_head: 8          # grouped-query attention
    d_ff: 4096
    max_seq: 1024
    vocab: 16000
    tie_embeddings: true

train:
  lr_nano: 3.0e-4
  lr_small: 2.5e-4
  warmup_frac: 0.02
  weight_decay: 0.1
  grad_clip: 1.0
  micro_batch:
    cpu: 16
    gpu: 64
  grad_accum:
    cpu: 4
    gpu: 2
  tokens_per_round_cpu: 5.0e7
  tokens_per_round_gpu: 5.0e8
  eval_every_steps: 500
  use_bf16_gpu: true      # CPU always trains in fp32 (see device.py)
  grad_checkpoint_gpu: true
  checkpoint_every_steps: 2000
  continue_lr_frac: 0.3   # peak-lr fraction for continued pretraining rounds
  min_lr_frac: 0.10       # cosine decay floor as a fraction of the peak lr

inference:
  max_new_tokens: 60
  temperature: 0.8
  top_k: 40
  top_p: 0.9
  repetition_penalty: 1.15

symbolic:
  spacy_model: en_core_web_sm
  min_confidence: 0.6
  disjoint_classes:       # curated is_a disjunction used by the consistency graph
    - bird
    - mammal
    - fish
    - insect
    - vehicle
    - food
    - plant
    - tool
  exclusive_pairs:        # binary object exclusions per (subject, relation)
    - [alive, dead]
    - [male, female]
    - [true, false]
  max_graph_entities: 200000  # RAM guard for the NetworkX graph

loop:
  max_rounds: 6
  human_gate_every: 3     # pause for explicit confirmation every N rounds
  min_ppl_gain: 0.01      # relative perplexity improvement required to promote
  max_diversity_drop: 0.20  # distinct-bigram ratio floor vs previous round
  holdout_sha256: 62d8992a3add265c68990949c7a4100ad412cd4c0b3f4d6f22153280d565d54e  # frozen by scripts/freeze_holdout.py; never regenerated
  round_timeout_s: 10800  # 3 h wall-clock budget per round on CPU
  new_docs_per_round: 50000
  replay_frac: 1.0        # fraction of historical documents replayed each round; 1.0 keeps the cumulative packed corpus

autofit:                  # hardware auto-fit policy, read only when model.profile is auto
  large_min_vram_gb: 40   # CUDA VRAM before auto may select the large profile
  small_min_vram_gb: 16   # CUDA VRAM before auto may select the small profile
  cpu_max_profile: nano   # highest profile allowed without a CUDA accelerator
  ram_headroom_cpu: 0.5   # fraction of system RAM usable for training tensors
  ram_headroom_gpu: 0.6   # fraction of VRAM usable for training tensors

topo:
  probe_sentences: 256
  layers: [2, 5]
  subsample: 500
  maxdim: 1
  geometry: {method: pca, n_components: 32, normalize: true}  # FROZEN at Fase 0-V2 (A1/A2)
  eps_betti: 0.3
  churn_bottleneck: 0.15    # initial calibration value; recalibrated only in Fase 1-V2 / N1-N3, frozen before S1
  b0_collapse_ratio: 0.5
  h1_growth_max: 0.25
  graph_topk: 800
  graph_conf_min: 0.6
  isa_relation: "is_a"
  max_cycle_len: 5
  max_cycles: 10000
  seed: 42

stress:
  modes: [dup_flood, contradiction_flood, lr_spike]
  dup_ratio: 0.9
  lr_multiplier: 10
