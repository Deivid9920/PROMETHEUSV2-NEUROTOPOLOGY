seed: 42
data:
  sources:
  - gutenberg
  - arxiv
  - wikipedia
  max_pages_per_source: 8
  out_dir: data_raw
  user_agent: PrometheusNS-Research/0.1
  rps: 1.0
  timeout_s: 20
  retries: 3
  holdout_frac: 0.02
clean:
  min_doc_chars: 500
  max_doc_chars: 100000
  minhash_perms: 128
  minhash_jaccard: 0.8
  keep_quantile: 0.8
  shingle_words: 5
  flush_every_docs: 200000
  mean_word_len_min: 3
  mean_word_len_max: 10
  symbol_ratio_max: 0.1
  arxiv_symbol_ratio_max: 0.2
  punct_line_frac_min: 0.8
  stopword_ratio_min: 0.3
tokenizer:
  vocab_nano: 8000
  vocab_small: 16000
  sample_mb: 30
model:
  profile: nano
  nano:
    d_model: 384
    n_layer: 6
    n_head: 6
    n_kv_head: 6
    d_ff: 1024
    max_seq: 256
    vocab: 8000
    tie_embeddings: true
  small:
    d_model: 768
    n_layer: 12
    n_head: 12
    n_kv_head: 12
    d_ff: 2048
    max_seq: 512
    vocab: 16000
    tie_embeddings: true
  large:
    d_model: 1024
    n_layer: 16
    n_head: 16
    n_kv_head: 8
    d_ff: 4096
    max_seq: 1024
    vocab: 16000
    tie_embeddings: true
train:
  lr_nano: 0.0003
  lr_small: 0.00025
  warmup_frac: 0.02
  weight_decay: 0.1
  grad_clip: 1.0
  micro_batch:
    cpu: 16
    gpu: 64
  grad_accum:
    cpu: 4
    gpu: 2
  tokens_per_round_cpu: 5.0e7
  tokens_per_round_gpu: 5.0e8
  eval_every_steps: 10
  use_bf16_gpu: true
  grad_checkpoint_gpu: true
  checkpoint_every_steps: 2000
  continue_lr_frac: 0.3
  min_lr_frac: 0.1
inference:
  max_new_tokens: 60
  temperature: 0.8
  top_k: 40
  top_p: 0.9
  repetition_penalty: 1.15
symbolic:
  spacy_model: en_core_web_sm
  min_confidence: 0.6
  disjoint_classes:
  - bird
  - mammal
  - fish
  - insect
  - vehicle
  - food
  - plant
  - tool
  exclusive_pairs:
  - - alive
    - dead
  - - male
    - female
  - - true
    - false
  max_graph_entities: 200000
loop:
  max_rounds: 6
  human_gate_every: 3
  min_ppl_gain: 0.01
  max_diversity_drop: 0.2
  holdout_sha256: 62d8992a3add265c68990949c7a4100ad412cd4c0b3f4d6f22153280d565d54e
  round_timeout_s: 10800
  new_docs_per_round: 50000
